name: Admin editor E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-browser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-e2e-failure
          path: output/playwright/test-results/
          retention-days: 7
